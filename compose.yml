name: nhipdang
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: nhipdang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nhipdang
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhipdang -d nhipdang"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: nhipdang:local
    build: .
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment: &app_env
      DATABASE_URL: postgresql://nhipdang:${POSTGRES_PASSWORD}@db:5432/nhipdang
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MEDIA_DIR: /app/.data/media
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-https://autotool.pmcoding.com}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    image: nhipdang:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment: *app_env
    volumes:
      - media_data:/app/.data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: nhipdang:local
    restart: unless-stopped
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker.ts"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  media_data:
